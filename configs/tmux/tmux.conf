set -g base-index 1
set -g pane-base-index 1

set-option -g allow-rename off


# True colors mode
# Add truecolor support
set-option -ga terminal-overrides ",*:Tc"
# Default terminal is 256 colors
set -g default-terminal "screen-256color"

setw -g window-status-current-style fg=black,bg=colour48

# re-map leader
unbind C-b
set -g prefix C-t


# use \ - to split-window
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -c "#{pane_current_path}"

# seamlessly navigate vim splits and tmux panes
# is_vim="~/is_vim.sh '#{pane_tty}'"
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Mapping to create more convenient shortcut for Colemak keyboard
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-n"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-e"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-i"  "select-pane -R"

bind -n C-f resize-pane -Z

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe "reattach-to-user-namespace pbcopy"

set -g default-shell $SHELL

# Comment this line on Ubuntu/Linux
# set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# Setting for vim
set-option -sg escape-time 10

# Important to detect whether the cursor is being in neovim or not. It makes navigation smoothly with Neovim.
set -g focus-events on

# Status bar theme: static copy of wfxr/tmux-power ('gold' theme, download speed on).
# The plugin applies this with ~50 separate tmux calls, which delayed the first prompt
# of a new tmux server by ~1.6s. Setting the options directly is instant.
set -g display-panes-active-colour "#ffb86c"
set -g display-panes-colour "#444444"
set -g message-command-style "fg=#ffb86c,bg=#262626"
set -g message-style "fg=#ffb86c,bg=#262626"
set -g status-bg "#262626"
set -g status-fg "#626262"
set -g status-interval "1"
set -g status-justify "centre"
set -g status-left "#[fg=#262626,bg=#ffb86c,bold]  #{user}@#h #[fg=#ffb86c,bg=#3a3a3a,nobold]#[fg=#ffb86c,bg=#3a3a3a]  #S #[fg=#3a3a3a,bg=#262626]"
set -g status-left-length "150"
set -g status-right "#[fg=#303030,bg=#262626]#[fg=#ffb86c,bg=#303030]  #{download_speed} #[fg=#3a3a3a]#[fg=#ffb86c,bg=#3a3a3a]  %T #[fg=#ffb86c,bg=#3a3a3a]#[fg=#262626,bg=#ffb86c]  %F "
set -g status-right-length "150"
setw -g clock-mode-colour "#ffb86c"
setw -g mode-style "bg=#ffb86c,fg=#626262"
setw -g pane-active-border-style "fg=#ffb86c,bg=#262626"
setw -g pane-border-style "fg=#444444,bg=default"
setw -g window-status-current-format "#[fg=#262626,bg=#3a3a3a]#[fg=#ffb86c,bold] #I:#W#F #[fg=#3a3a3a,bg=#262626,nobold]"
setw -g window-status-format " #I:#W#F "
setw -g window-status-separator ''

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'schasse/tmux-jump'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# -b: load plugins in the background so they never delay the first prompt.
run -b '~/.tmux/plugins/tpm/tpm'

# Visually distinguish claude-squad sessions (names starting with claudesquad_)
set-hook -g client-session-changed {
  if-shell 'tmux display-message -p "#{session_name}" | grep -q "^claudesquad_"' {
    set status-style 'bg=colour54,fg=colour255'
    set status-left '#[fg=colour255,bg=colour93,bold] 🤖 #S #[fg=colour93,bg=colour54,nobold] '
    set status-right '#[fg=colour93,bg=colour54]#[fg=colour255,bg=colour93,bold] claude-squad '
    setw window-status-current-style 'fg=colour255,bg=colour93,bold'
    setw window-status-style 'fg=colour188,bg=colour54'
    set pane-border-style 'fg=colour93'
    set pane-active-border-style 'fg=colour129,bold'
    set pane-border-status top
    set pane-border-format '#[fg=colour255,bg=colour93,bold] 🤖 #{pane_index}: #{pane_current_command} #[default]'
  } {
    set -u status-style
    set -u status-left
    set -u status-right
    setw -u window-status-current-style
    setw -u window-status-style
    set -u pane-border-style
    set -u pane-active-border-style
    set -u pane-border-status
    set -u pane-border-format
  }
}

set-hook -g session-created {
  if-shell 'tmux display-message -p "#{session_name}" | grep -q "^claudesquad_"' {
    set status-style 'bg=colour54,fg=colour255'
    set status-left '#[fg=colour255,bg=colour93,bold] 🤖 #S #[fg=colour93,bg=colour54,nobold] '
    set status-right '#[fg=colour93,bg=colour54]#[fg=colour255,bg=colour93,bold] claude-squad '
    setw window-status-current-style 'fg=colour255,bg=colour93,bold'
    setw window-status-style 'fg=colour188,bg=colour54'
    set pane-border-style 'fg=colour93'
    set pane-active-border-style 'fg=colour129,bold'
    set pane-border-status top
    set pane-border-format '#[fg=colour255,bg=colour93,bold] 🤖 #{pane_index}: #{pane_current_command} #[default]'
  }
}
