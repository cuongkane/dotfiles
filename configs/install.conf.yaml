- defaults:
    link:
      relink: true
      create: true
      force: true

- clean:
    - '~'
    - '~/.config'

- link:
    ~/.zshrc: zsh/zshrc
    ~/.tmux.conf: tmux/tmux.conf
    ~/.gitconfig: git/gitconfig
    ~/.config/lazygit/config.yml: lazygit/config.yml
    ~/.config/alacritty/alacritty.toml: alacritty/alacritty.toml
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json
    ~/.claude/commands: claude/commands
    ~/.claude/skills: claude/skills
    ~/.claude/agents: claude/agents
    ~/.codex/config.toml: codex/config.toml
    ~/.codex/rules/default.rules: codex/rules/default.rules
    ~/.codex/skills/dotfiles-maintainer: codex/skills/dotfiles-maintainer
    ~/.codex/skills/code-review-practices: codex/skills/code-review-practices
    ~/.codex/skills/ship-changes: codex/skills/ship-changes
    ~/.codex/skills/create-latex-slides: codex/skills/create-latex-slides
    ~/.codex/skills/browser-ui-debugger: codex/skills/browser-ui-debugger
    ~/.codex/skills/browser-use-automation: codex/skills/browser-use-automation
